# Taina single-box deployment. install.sh writes the .env this file reads.
# Caddy is the only public ingress; the app speaks plain HTTP on 4000 on the
# internal network and is published to the host on loopback only
# (127.0.0.1:4000, for `tailscale serve` and checks from the box itself).

# Docker's default json-file logger never rotates. On a box with a small disk
# (an SD card is the common case) unbounded container logs fill the filesystem
# and take the community down with them. Cap every service at 10 MB across 3
# files.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${TAINA_IMAGE:-ghcr.io/taina-labs/taina:latest}
    # `missing`, not `always`: a locally built image (see build-image.sh) must be
    # usable, and an offline box must still be able to `up -d` after a restart.
    pull_policy: missing
    environment:
      # The database is a SQLite file the app owns, under /app/data. There is
      # no database service: the release creates and migrates the file on boot.
      DATABASE_PATH: /app/data/taina.db
      PHX_HOST: ${PHX_HOST:-localhost}
      PHX_SERVER: "true"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}
      PORT: "4000"
      # Storage (Ybira uploads) - must match STORAGE_ROOT read in
      # config/runtime.exs, or uploads fall back to the default path.
      STORAGE_ROOT: /app/storage
      # Backup (Nhaman) - off by default; "true" enables the scheduled SQLite
      # snapshot plus storage archive written under BACKUP_DIR.
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_DIR: /app/backups
      # Update check - "true" lets the UI advertise newer Taina releases.
      TAINA_UPDATE_CHECK: ${TAINA_UPDATE_CHECK:-false}
    # Loopback only: reachable from the box itself, which is what
    # `tailscale serve` needs. Other machines on the network still get in
    # through Caddy (ports 80/443), never straight into the app. Caddy itself
    # reaches the app by service name on the compose network
    # (reverse_proxy app:4000); containers there reach any port, so no
    # `expose` is needed for that.
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      # Data roots. Defaults are named Docker volumes; set TAINA_DB_DIR /
      # TAINA_STORAGE_DIR / TAINA_BACKUP_DIR in .env to host paths (e.g. a
      # mounted disk) without editing this file. Bind-mount paths must be owned
      # by 65534:65534, the user the app runs as. See the tekoa installation
      # guide.
      - ${TAINA_DB_DIR:-db_data}:/app/data
      - ${TAINA_STORAGE_DIR:-storage_data}:/app/storage
      - ${TAINA_BACKUP_DIR:-backups_data}:/app/backups
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    depends_on:
      - app
    # When TAINA_DOMAIN is set and ports 80/443 are reachable, Caddy gets a real
    # Let's Encrypt cert (HTTP-01) via deploy/Caddyfile. When unset,
    # deploy/Caddyfile.local serves any hostname with local-CA certificates
    # issued on demand (TLS on the box itself is then up to the overlay, e.g.
    # Tailscale). See the acesso-remoto guide for the topology matrix
    # (Tailscale/Headscale certs).
    environment:
      TAINA_DOMAIN: ${TAINA_DOMAIN:-}
    # The config file is picked at runtime: install.sh/update.sh export
    # TAINA_CADDYFILE (Caddyfile when TAINA_DOMAIN is set, Caddyfile.local
    # otherwise). Both are mounted so either one is readable.
    command: ["caddy", "run", "--config", "/etc/caddy/${TAINA_CADDYFILE:-Caddyfile.local}", "--adapter", "caddyfile"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile.local:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
    driver: local
  storage_data:
    driver: local
  backups_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  default:
    name: taina_network
