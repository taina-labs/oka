# Taina single-box deployment. install.sh writes the .env this file reads.
# Caddy is the only public ingress; the app speaks plain HTTP on 4000 on the
# internal network and is published to the host on loopback only
# (127.0.0.1:4000, for `tailscale serve` and checks from the box itself).

# Docker's default json-file logger never rotates. On a box with a small disk
# (an SD card is the common case) unbounded container logs fill the filesystem,
# and PostgreSQL going read-only takes the whole community down with them. Cap
# every service at 10 MB across 3 files.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    # Homelab sizing (Raspberry Pi class box): a small shared buffer and a
    # tight connection ceiling keep PostgreSQL well-behaved next to the app.
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-taina}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # First-boot scripts: they run once, when the data volume is still
      # empty, and create the non-superuser role the app connects as.
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taina}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${TAINA_IMAGE:-ghcr.io/taina-labs/taina:latest}
    # `missing`, not `always`: a locally built image (see build-image.sh) must be
    # usable, and an offline box must still be able to `up -d` after a restart.
    pull_policy: missing
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Non-superuser role: the database enforces the RLS policies (per-
      # community isolation) on everything the app touches.
      DATABASE_URL: ecto://taina_app:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db/${POSTGRES_DB:-taina}
      # Superuser connection, only for Nhaman backups (pg_dump/pg_restore).
      BACKUP_DATABASE_URL: postgresql://${POSTGRES_USER:-taina}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db/${POSTGRES_DB:-taina}
      PHX_HOST: ${PHX_HOST:-localhost}
      PHX_SERVER: "true"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}
      PORT: "4000"
      # Storage (Ybira uploads) - must match STORAGE_ROOT read in
      # config/runtime.exs, or uploads fall back to the default path.
      STORAGE_ROOT: /app/storage
      # Backup (Nhaman) - off by default; "true" enables the scheduled
      # pg_dump + storage archive written under BACKUP_DIR.
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_DIR: /app/backups
      # Update check - "true" lets the UI advertise newer Taina releases.
      TAINA_UPDATE_CHECK: ${TAINA_UPDATE_CHECK:-false}
    # Loopback only: reachable from the box itself, which is what
    # `tailscale serve` needs. Other machines on the network still get in
    # through Caddy (ports 80/443), never straight into the app. Caddy itself
    # reaches the app by service name on the compose network
    # (reverse_proxy app:4000); containers there reach any port, so no
    # `expose` is needed for that.
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      # Data roots. Defaults are named Docker volumes; set TAINA_STORAGE_DIR /
      # TAINA_BACKUP_DIR in .env to host paths (e.g. a mounted disk) without
      # editing this file. Bind-mount paths must be owned by 65534:65534,
      # the user the app runs as. See the tekoa installation guide.
      - ${TAINA_STORAGE_DIR:-storage_data}:/app/storage
      - ${TAINA_BACKUP_DIR:-backups_data}:/app/backups
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    depends_on:
      - app
    # When TAINA_DOMAIN is set and ports 80/443 are reachable, Caddy gets a real
    # Let's Encrypt cert (HTTP-01) via deploy/Caddyfile. When unset,
    # deploy/Caddyfile.local serves any hostname with local-CA certificates
    # issued on demand (TLS on the box itself is then up to the overlay, e.g.
    # Tailscale). See the acesso-remoto guide for the topology matrix
    # (Tailscale/Headscale certs).
    environment:
      TAINA_DOMAIN: ${TAINA_DOMAIN:-}
    # The config file is picked at runtime: install.sh/update.sh export
    # TAINA_CADDYFILE (Caddyfile when TAINA_DOMAIN is set, Caddyfile.local
    # otherwise). Both are mounted so either one is readable.
    command: ["caddy", "run", "--config", "/etc/caddy/${TAINA_CADDYFILE:-Caddyfile.local}", "--adapter", "caddyfile"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile.local:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
    driver: local
  storage_data:
    driver: local
  backups_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  default:
    name: taina_network
