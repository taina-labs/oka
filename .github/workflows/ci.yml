name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build
        run: zig build

      - name: Test
        run: zig build test
