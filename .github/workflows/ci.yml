name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: sh -n deploy/compose/taina deploy/compose/smoke.sh
      - name: ShellCheck
        run: shellcheck deploy/compose/taina deploy/compose/smoke.sh
      - name: Compose static config
        run: |
          mkdir -p deploy/compose/backups
          cp deploy/compose/taina.conf.example deploy/compose/taina.conf
          docker compose --project-directory deploy/compose --file deploy/compose/compose.yaml config
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Nix formatting
        run: nix run nixpkgs#nixpkgs-fmt -- --check flake.nix
      - name: Nix flake checks
        run: nix flake check --no-build
