name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-linux
          - aarch64-linux
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build the CLI
        working-directory: cli
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: Collect the binary
        run: |
          mkdir -p dist
          cp cli/zig-out/bin/taina dist/taina-${{ matrix.target }}

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/taina-${{ matrix.target }}
